services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sheetaro_backend
    env_file:
      - .env
    ports:
      - "3010:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sheetaro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: sheetaro_bot
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3001}
      - API_BASE_URL=${API_BASE_URL:-http://backend:3001}
    depends_on:
      backend:
        condition: service_started
    networks:
      - sheetaro_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://51.89.47.244:3010}
    container_name: sheetaro_frontend
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://51.89.47.244:3010}
    ports:
      - "3011:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - sheetaro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  db:
    image: postgres:16-alpine
    container_name: sheetaro_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sheetaro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sheetaro}
    volumes:
      - sheetaro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sheetaro} -d ${POSTGRES_DB:-sheetaro}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sheetaro_network
    restart: unless-stopped
    # Don't expose port in production (only accessible via Docker network)
    # ports:
    #   - "5435:5432"

  redis:
    image: redis:7-alpine
    container_name: sheetaro_redis
    volumes:
      - sheetaro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - sheetaro_network
    restart: unless-stopped
    # Don't expose port in production (only accessible via Docker network)
    # ports:
    #   - "6381:6379"

networks:
  sheetaro_network:
    name: sheetaro_network
    driver: bridge

volumes:
  sheetaro_postgres_data:
    name: sheetaro_postgres_data
  sheetaro_redis_data:
    name: sheetaro_redis_data

